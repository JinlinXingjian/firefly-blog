[blog]
NAME = "博客"
ENABLE = true
HOTKEY = "ctrl+alt+b"
NEW_POST_HOTKEY = "ctrl+alt+n"
PUBLISH_HOTKEY = "ctrl+alt+p"
PUBLISH_ALL_HOTKEY = "ctrl+alt+shift+p"
# 改成新电脑上的仓库绝对路径
BLOG_ROOT = 'C:\path\to\firefly-blog'
SITE_URL = "https://jinlinxingjian-blog.pages.dev"

[action_buttons]
ENABLE = true
BUTTON_SIZE = "38px"
BUTTON_GAP = "10px"
POSITION_RIGHT = "30px"
POSITION_BOTTOM = "48px"
BUTTONS = [
  { enable = true, coordinate = [0, 0], size = "16px", icon = "fa fa-book", hint = "博客模式", callback = "blog" },
  { enable = true, coordinate = [1, 0], size = "16px", icon = "fa fa-plus", hint = "新建文章", callback = "blog.newPost" },
  { enable = true, coordinate = [0, 1], size = "16px", icon = "fa fa-cloud-upload", hint = "发布当前文章", callback = "blog.publish" },
  { enable = true, coordinate = [1, 1], size = "16px", icon = "fa fa-external-link", hint = "打开线上博客", callback = "blog.openSite" },
]
