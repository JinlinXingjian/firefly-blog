name: Deploy to Cloudflare Pages

on:
  # 先在手动触发下验证；配置好 CLOUDFLARE_API_TOKEN 后再加上 push 自动触发
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cloudflare-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build site
        run: pnpm build
        env:
          SITE_URL: https://jinlinxingjian-blog.pages.dev

      - name: Deploy to Cloudflare Pages
        run: npx wrangler pages deploy dist --project-name=jinlinxingjian-blog --branch=master --commit-hash=${{ github.sha }} --commit-dirty=true
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: 23b2c7f3a74e4641777d8982228bf1e4
